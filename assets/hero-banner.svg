<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111c33" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="purpleBadge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="100" r="120" fill="#0d9488" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)" />

  <!-- Logo Icon -->
  <g transform="translate(80, 75)">
    <rect width="70" height="70" rx="18" fill="url(#accentGrad)" />
    <path d="M 23 35 L 32 44 L 48 26" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="35" cy="35" r="24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 4" opacity="0.8" />
  </g>

  <!-- Title & Subtitle -->
  <text x="170" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
    GroupSpend <tspan fill="url(#accentGrad)">Web</tspan>
  </text>
  <text x="170" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
    Enterprise Real-Time Expense Sharing &amp; Peer-Approved Financial Settlement Platform
  </text>

  <!-- Feature Highlights / Tagline -->
  <g transform="translate(80, 195)">
    <!-- Pill 1: Real-time Socket.IO -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="24" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#38bdf8">⚡ Socket.IO Real-Time Chat</text>

    <!-- Pill 2: Peer-Approved Settlements -->
    <rect x="235" y="0" width="265" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="255" y="24" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#34d399">🛡️ Peer-Approved Settlements</text>

    <!-- Pill 3: Integer Paise Accounting -->
    <rect x="515" y="0" width="225" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="535" y="24" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#fbbf24">💰 Zero Floating-Point Drift</text>

    <!-- Pill 4: Immutable Audit Trail -->
    <rect x="755" y="0" width="210" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="775" y="24" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#c084fc">📜 Immutable Audit Logs</text>
  </g>

  <!-- Metrics / Tech Badges Row -->
  <g transform="translate(80, 260)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="230" height="90" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="24" y="38" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#14b8a6">40 / 40 PASS</text>
    <text x="24" y="65" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Automated Unit &amp; Sec Tests</text>

    <!-- Metric 2 -->
    <rect x="250" y="0" width="230" height="90" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="274" y="38" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#38bdf8">&lt; 1 ms</text>
    <text x="274" y="65" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Real-time WebSocket Latency</text>

    <!-- Metric 3 -->
    <rect x="500" y="0" width="230" height="90" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="524" y="38" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#a78bfa">MERN + WS</text>
    <text x="524" y="65" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">React • Express • Mongo • Sockets</text>

    <!-- Metric 4 -->
    <rect x="750" y="0" width="290" height="90" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="774" y="38" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" fill="#34d399">100% Anti-Fraud</text>
    <text x="774" y="65" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">No Self-Approval • Verified Users</text>
  </g>
</svg>
