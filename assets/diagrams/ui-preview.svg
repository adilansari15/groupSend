<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tealGradU" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="1100" height="640" fill="url(#bgDark)" rx="16" />

  <!-- App Window Shell -->
  <g transform="translate(30, 30)" filter="url(#softShadow)">
    <rect width="1040" height="580" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

    <!-- Window Top Header Bar -->
    <rect width="1040" height="45" rx="14" fill="#1e293b" />
    <circle cx="25" cy="22" r="6" fill="#ef4444" />
    <circle cx="45" cy="22" r="6" fill="#f59e0b" />
    <circle cx="65" cy="22" r="6" fill="#10b981" />
    <text x="520" y="27" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">
      https://groupspend.local/groups/trip-to-goa
    </text>

    <!-- Sidebar (Left) -->
    <g transform="translate(0, 45)">
      <rect width="210" height="535" fill="#111827" />
      
      <!-- Brand -->
      <g transform="translate(20, 20)">
        <rect width="32" height="32" rx="8" fill="url(#tealGradU)" />
        <path d="M 10 16 L 14 20 L 22 12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
        <text x="42" y="22" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">GroupSpend</text>
      </g>

      <!-- Nav Items -->
      <g transform="translate(15, 75)">
        <rect width="180" height="36" rx="8" fill="#1e293b" />
        <text x="35" y="23" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#14b8a6">📊 Expenses</text>
        
        <text x="35" y="62" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">💬 Group Chat</text>
        <circle cx="160" cy="58" r="4" fill="#38bdf8" />

        <text x="35" y="100" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">⚡ Activity Trail</text>
        
        <text x="35" y="138" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">🤝 Settlements</text>
        <rect x="145" y="125" width="22" height="18" rx="9" fill="#ef4444" />
        <text x="156" y="138" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

        <text x="35" y="176" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">👥 Members (4)</text>
        <text x="35" y="214" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">📈 Reports</text>
      </g>
    </g>

    <!-- Main Content Area -->
    <g transform="translate(230, 60)">
      
      <!-- Real-time Toast Banner -->
      <rect width="780" height="38" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
      <text x="20" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">
        🔔 Real-Time: Adil requested settlement of ₹500 with Saifu (Peer Approval Required)
      </text>

      <!-- Dashboard Stats -->
      <g transform="translate(0, 50)">
        <!-- Stat Card 1 -->
        <rect width="245" height="95" rx="10" fill="url(#cardDark)" stroke="#334155" />
        <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Total Group Spend</text>
        <text x="20" y="65" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">₹ 8,450.00</text>
        <text x="20" y="82" font-family="-apple-system, sans-serif" font-size="10" fill="#10b981">845,000 paise stored</text>

        <!-- Stat Card 2 -->
        <rect x="265" width="245" height="95" rx="10" fill="url(#cardDark)" stroke="#334155" />
        <text x="285" y="32" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Your Net Balance</text>
        <text x="285" y="65" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#14b8a6">+ ₹ 1,250.00</text>
        <text x="285" y="82" font-family="-apple-system, sans-serif" font-size="10" fill="#14b8a6">You get back</text>

        <!-- Stat Card 3 -->
        <rect x="530" width="250" height="95" rx="10" fill="url(#cardDark)" stroke="#334155" />
        <text x="550" y="32" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Active Settlements</text>
        <text x="550" y="65" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#fbbf24">1 Pending</text>
        <text x="550" y="82" font-family="-apple-system, sans-serif" font-size="10" fill="#fbbf24">Awaiting peer approval</text>
      </g>

      <!-- Two-Column Feed: Left (Expenses), Right (Chat & Approvals) -->
      <g transform="translate(0, 160)">
        
        <!-- Left: Expenses Feed -->
        <g>
          <rect width="430" height="340" rx="10" fill="url(#cardDark)" stroke="#334155" />
          <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">Recent Expenses</text>
          
          <!-- Expense Row 1 -->
          <g transform="translate(20, 50)">
            <rect width="390" height="55" rx="8" fill="#1e293b" />
            <text x="15" y="25" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Villa Booking</text>
            <text x="15" y="42" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Paid by Adil • Split equally (4)</text>
            <text x="375" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="end">₹ 4,000</text>
          </g>

          <!-- Expense Row 2 -->
          <g transform="translate(20, 115)">
            <rect width="390" height="55" rx="8" fill="#1e293b" />
            <text x="15" y="25" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Seafood Dinner</text>
            <text x="15" y="42" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Paid by Saifu • Custom shares</text>
            <text x="375" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="end">₹ 2,450</text>
          </g>

          <!-- Expense Row 3 -->
          <g transform="translate(20, 180)">
            <rect width="390" height="55" rx="8" fill="#1e293b" />
            <text x="15" y="25" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Scooter Fuel</text>
            <text x="15" y="42" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Paid by Mirza • Split equally</text>
            <text x="375" y="32" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="end">₹ 800</text>
          </g>
        </g>

        <!-- Right: Pending Peer Approval Card & Live Chat Bubble -->
        <g transform="translate(445, 0)">
          <!-- Approval Card -->
          <rect width="335" height="155" rx="10" fill="url(#cardDark)" stroke="#f59e0b" stroke-width="1.5" />
          <text x="20" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">
            🛡️ Peer Settlement Approval Required
          </text>
          <text x="20" y="52" font-family="-apple-system, sans-serif" font-size="12" fill="#cbd5e1">
            Adil marked ₹500 paid to Saifu.
          </text>
          <text x="20" y="70" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">
            Note: "Settled lunch dues via UPI"
          </text>

          <!-- Approve / Reject buttons -->
          <rect x="20" y="95" width="140" height="36" rx="6" fill="#059669" />
          <text x="90" y="118" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✓ Approve Settle</text>

          <rect x="175" y="95" width="140" height="36" rx="6" fill="#334155" />
          <text x="245" y="118" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">✕ Reject</text>

          <!-- Live Group Chat Snippet -->
          <g transform="translate(0, 170)">
            <rect width="335" height="170" rx="10" fill="url(#cardDark)" stroke="#334155" />
            <text x="20" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">
              💬 Group Chat (Socket.IO)
            </text>

            <rect x="15" y="42" width="240" height="42" rx="8" fill="#1e293b" />
            <text x="25" y="58" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#14b8a6">Saifu</text>
            <text x="25" y="74" font-family="-apple-system, sans-serif" font-size="11" fill="#f1f5f9">Just added dinner bills guys! 🍤</text>

            <rect x="80" y="92" width="240" height="42" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="0.8" />
            <text x="90" y="108" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#2dd4bf">You (Adil)</text>
            <text x="90" y="124" font-family="-apple-system, sans-serif" font-size="11" fill="#f1f5f9">Paid my ₹500 share, pls approve! 👍</text>
          </g>
        </g>

      </g>
    </g>
  </g>
</svg>
