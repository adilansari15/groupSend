<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="greenG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="redG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="1000" height="580" fill="#090d16" rx="16" />

  <!-- Title -->
  <text x="500" y="45" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Multi-Party Peer Settlement Approval Sequence
  </text>
  <text x="500" y="70" font-family="-apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Eliminating Unilateral Exploits with Cryptographic Identity &amp; Peer Verification
  </text>

  <!-- Actors -->
  <g transform="translate(100, 100)">
    <rect width="140" height="45" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="70" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">👤 Requester (Adil)</text>
    <line x1="70" y1="45" x2="70" y2="440" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <g transform="translate(430, 100)">
    <rect width="140" height="45" rx="8" fill="#1e293b" stroke="#14b8a6" stroke-width="1.5" />
    <text x="70" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#14b8a6" text-anchor="middle">🛡️ Backend Guard</text>
    <line x1="70" y1="45" x2="70" y2="440" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <g transform="translate(760, 100)">
    <rect width="140" height="45" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <text x="70" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#a855f7" text-anchor="middle">👥 Peer Member (Saifu)</text>
    <line x1="70" y1="45" x2="70" y2="440" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Step 1: Request Settlement -->
  <g transform="translate(170, 180)">
    <line x1="0" y1="0" x2="330" y2="0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="20" y="-22" width="280" height="24" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="160" y="-6" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">1. POST /settlement-requests (₹500 / 50000 paise)</text>
  </g>

  <!-- Step 2: DB Pending & Broadcast -->
  <g transform="translate(500, 230)">
    <line x1="0" y1="0" x2="330" y2="0" stroke="#10b981" stroke-width="2" />
    <rect x="25" y="-22" width="280" height="24" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="165" y="-6" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#10b981" text-anchor="middle">2. Socket.IO: 'Adil requested settlement'</text>
  </g>

  <!-- Step 3: Self-Approval Attempt (BLOCKED) -->
  <g transform="translate(170, 290)">
    <line x1="0" y1="0" x2="330" y2="0" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3" />
    <rect x="30" y="-22" width="260" height="24" rx="4" fill="#450a0a" stroke="#ef4444" />
    <text x="160" y="-6" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#fca5a5" text-anchor="middle">3. Adil tries self-approval → 403 Forbidden</text>
  </g>

  <!-- Step 4: Peer Approves -->
  <g transform="translate(500, 360)">
    <line x1="330" y1="0" x2="0" y2="0" stroke="#a855f7" stroke-width="2" />
    <rect x="35" y="-22" width="260" height="24" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="165" y="-6" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">4. Saifu clicks 'Approve' (POST /approve)</text>
  </g>

  <!-- Step 5: Finalized Settlement & Audit Log -->
  <g transform="translate(500, 430)">
    <line x1="0" y1="0" x2="-330" y2="0" stroke="#10b981" stroke-width="2" />
    <line x1="0" y1="0" x2="330" y2="0" stroke="#10b981" stroke-width="2" />
    <rect x="-160" y="-22" width="320" height="24" rx="4" fill="#064e3b" stroke="#10b981" />
    <text x="0" y="-6" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">5. Balances Updated + AuditLog Written + WS Emit</text>
  </g>

  <!-- Bottom Summary Card -->
  <g transform="translate(100, 490)">
    <rect width="800" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="400" y="26" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">
      Guaranteed Integrity: Requester Cannot Approve • Real Verified Members Only • Immutable Audit Trail
    </text>
    <text x="400" y="46" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
      Every state transition is tracked in MongoDB with microsecond-level audit trail timestamps.
    </text>
  </g>
</svg>
