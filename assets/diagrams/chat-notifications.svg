<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%">
  <defs>
    <linearGradient id="chatBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="chatWindowBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090e1a" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="640" fill="url(#chatBgDark)" rx="16" />

  <!-- Grid overlay -->
  <g opacity="0.15">
    <path d="M 0 80 L 1100 80 M 0 160 L 1100 160 M 0 240 L 1100 240 M 0 320 L 1100 320 M 0 400 L 1100 400 M 0 480 L 1100 480 M 0 560 L 1100 560" stroke="#334155" stroke-width="0.8" />
    <path d="M 110 0 L 110 640 M 220 0 L 220 640 M 330 0 L 330 640 M 440 0 L 440 640 M 550 0 L 550 640 M 660 0 L 660 640 M 770 0 L 770 640 M 880 0 L 880 640 M 990 0 L 990 640" stroke="#334155" stroke-width="0.8" />
  </g>

  <!-- Title Badge Top Header -->
  <g transform="translate(40, 28)">
    <rect width="420" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#10b981" filter="url(#glowGreen)" />
    <text x="36" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
      REAL-TIME GROUP CHAT &amp; FINANCIAL NOTIFICATIONS
    </text>
  </g>

  <!-- Main Chat Window Shell -->
  <g transform="translate(40, 75)" filter="url(#softShadow)">
    <rect width="680" height="525" rx="14" fill="url(#chatWindowBg)" stroke="#334155" stroke-width="1.5" />

    <!-- Chat Header Bar -->
    <rect width="680" height="52" rx="14" fill="#1e293b" />
    <rect y="38" width="680" height="14" fill="#1e293b" />
    
    <!-- Window buttons -->
    <circle cx="22" cy="26" r="5.5" fill="#ef4444" />
    <circle cx="40" cy="26" r="5.5" fill="#f59e0b" />
    <circle cx="58" cy="26" r="5.5" fill="#10b981" />

    <!-- Group Room Title -->
    <g transform="translate(85, 12)">
      <rect width="28" height="28" rx="7" fill="url(#tealGrad)" />
      <text x="14" y="19" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle" fill="#ffffff">💬</text>
      <text x="38" y="15" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Trip to Goa Chat</text>
      <text x="38" y="27" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">4 members • room: group:66fa19b2</text>
    </g>

    <!-- Live indicator badge -->
    <g transform="translate(585, 16)">
      <rect width="75" height="22" rx="11" fill="#064e3b" stroke="#059669" stroke-width="1" />
      <circle cx="14" cy="11" r="3.5" fill="#10b981" />
      <text x="25" y="15" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#6ee7b7">LIVE SYNC</text>
    </g>

    <line x1="0" y1="52" x2="680" y2="52" stroke="#334155" stroke-width="1" />

    <!-- Chat Stream Area -->
    <g transform="translate(24, 66)">
      
      <!-- User Message 1: Adil -->
      <g transform="translate(0, 0)">
        <text x="4" y="12" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Adil Ansari</text>
        <rect x="0" y="18" width="310" height="34" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="40" font-family="-apple-system, sans-serif" font-size="12.5" fill="#e2e8f0">Booked the beach villa for our trip! 🌴</text>
        <text x="320" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">10:42 AM</text>
      </g>

      <!-- SYSTEM NOTIFICATION 1: Payment Added -->
      <g transform="translate(30, 68)">
        <rect width="570" height="52" rx="26" fill="#0f2922" stroke="#0d9488" stroke-width="1.3" />
        <circle cx="28" cy="26" r="15" fill="#115e59" />
        <text x="28" y="32" font-family="-apple-system, sans-serif" font-size="15" text-anchor="middle">💸</text>
        <text x="56" y="24" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#2dd4bf">
          Adil added a payment of ₹4,800 for "Beach Villa Booking"
        </text>
        <text x="56" y="40" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#99f6e4">
          Automated System Event • Split equally among 4 members (₹1,200 each)
        </text>
        <text x="525" y="31" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#5eead4">10:42 AM</text>
      </g>

      <!-- User Message 2: Rahul -->
      <g transform="translate(290, 134)">
        <text x="290" y="12" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="end">Rahul Sharma (You)</text>
        <rect x="0" y="18" width="310" height="34" rx="10" fill="#0d9488" />
        <text x="14" y="40" font-family="-apple-system, sans-serif" font-size="12.5" fill="#ffffff">Awesome! Sending my ₹1,200 share now.</text>
        <text x="-12" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="end">10:44 AM</text>
      </g>

      <!-- SYSTEM NOTIFICATION 2: Settlement Requested -->
      <g transform="translate(30, 202)">
        <rect width="570" height="52" rx="26" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.3" />
        <circle cx="28" cy="26" r="15" fill="#3730a3" />
        <text x="28" y="32" font-family="-apple-system, sans-serif" font-size="15" text-anchor="middle">💳</text>
        <text x="56" y="24" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#a5b4fc">
          Rahul requested a settlement of ₹1,200 (Rahul → Adil)
        </text>
        <text x="56" y="40" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#c7d2fe">
          Multi-Party Settlement • Pending Peer Verification (anti-self-approval)
        </text>
        <text x="525" y="31" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#818cf8">10:45 AM</text>
      </g>

      <!-- SYSTEM NOTIFICATION 3: Settlement Approved & Completed -->
      <g transform="translate(30, 268)">
        <rect width="570" height="52" rx="26" fill="#064e3b" stroke="#10b981" stroke-width="1.3" />
        <circle cx="28" cy="26" r="15" fill="#047857" />
        <text x="28" y="32" font-family="-apple-system, sans-serif" font-size="15" text-anchor="middle">✅</text>
        <text x="56" y="24" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#6ee7b7">
          Sara approved and completed a settlement of ₹1,200 (Rahul → Adil)
        </text>
        <text x="56" y="40" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#a7f3d0">
          Peer Verified by Sara • Balances &amp; Minimal Debt Graph Updated Live
        </text>
        <text x="525" y="31" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#34d399">10:46 AM</text>
      </g>

      <!-- User Message 3: Sara -->
      <g transform="translate(0, 334)">
        <text x="4" y="12" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Sara Khan</text>
        <rect x="0" y="18" width="330" height="34" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="40" font-family="-apple-system, sans-serif" font-size="12.5" fill="#e2e8f0">Verified and approved! Rahul's debt is cleared 🎉</text>
        <text x="340" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">10:46 AM</text>
      </g>
    </g>

    <!-- Chat Input Field Footer -->
    <g transform="translate(16, 464)">
      <rect width="648" height="46" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">Message Trip to Goa...</text>
      <g transform="translate(570, 7)">
        <rect width="68" height="32" rx="7" fill="url(#tealGrad)" />
        <text x="34" y="21" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Send 🚀</text>
      </g>
    </g>
  </g>

  <!-- Side Architecture Cards (Right Column) -->
  <g transform="translate(745, 75)">
    <!-- Card 1: Real-Time Architecture -->
    <g filter="url(#softShadow)">
      <rect width="315" height="160" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.3" />
      <rect width="315" height="34" rx="12" fill="#1e293b" />
      <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">⚡ WEBSOCKET PIPELINE</text>
      
      <g transform="translate(14, 48)">
        <text x="0" y="14" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">1. Event Triggered</text>
        <text x="0" y="28" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Payment or settlement created</text>

        <text x="0" y="52" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf">2. postSystemChatMessage()</text>
        <text x="0" y="66" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Persisted in Mongo as isSystem: true</text>

        <text x="0" y="90" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">3. Room Broadcast (new-message)</text>
        <text x="0" y="104" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Zero-latency dispatch to group room</text>
      </g>
    </g>

    <!-- Card 2: Financial Integrity Rules -->
    <g transform="translate(0, 180)" filter="url(#softShadow)">
      <rect width="315" height="175" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.3" />
      <rect width="315" height="34" rx="12" fill="#1e293b" />
      <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399">🛡️ FINANCIAL INTEGRITY</text>

      <g transform="translate(14, 48)">
        <text x="0" y="14" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#f8fafc">💸 Instant Payment Awareness</text>
        <text x="0" y="27" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">Every rupee accounted for in-feed</text>

        <text x="0" y="50" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#f8fafc">🚫 Anti-Self-Approval Pill</text>
        <text x="0" y="63" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">Requesters cannot clear own debt</text>

        <text x="0" y="86" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#f8fafc">🤝 Peer Verified Badges</text>
        <text x="0" y="99" font-family="-apple-system, sans-serif" font-size="10.5" fill="#94a3b8">Clear proof of peer authorization</text>

        <text x="0" y="120" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#10b981">✨ ZERO CONTEXT SWITCHING</text>
      </g>
    </g>

    <!-- Card 3: Formats Supported -->
    <g transform="translate(0, 375)" filter="url(#softShadow)">
      <rect width="315" height="145" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.3" />
      <rect width="315" height="34" rx="12" fill="#1e293b" />
      <text x="14" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">🔔 NOTIFICATION EVENT TYPES</text>

      <g transform="translate(14, 46)">
        <text x="0" y="14" font-family="-apple-system, sans-serif" font-size="11" fill="#2dd4bf">• 💸 Expense Added (Title &amp; Amount)</text>
        <text x="0" y="32" font-family="-apple-system, sans-serif" font-size="11" fill="#a5b4fc">• 💳 Settlement Request Created</text>
        <text x="0" y="50" font-family="-apple-system, sans-serif" font-size="11" fill="#34d399">• ✅ Peer Approved &amp; Settled</text>
        <text x="0" y="68" font-family="-apple-system, sans-serif" font-size="11" fill="#f87171">• ❌ Settlement Rejected by Peer</text>
        <text x="0" y="86" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Synced in real-time via Socket.IO</text>
      </g>
    </g>
  </g>
</svg>
